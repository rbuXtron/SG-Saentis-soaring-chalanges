name: Daily Badge Snapshot

# Taeglicher Snapshot des Club-Badgestands (Level-Verlauf + Saison-Punkte).
# Ergaenzt die stuendliche Live-Wertung: diese Datei ist das "Gedaechtnis"
# fuer Bewegung (▲/▼) und "Aufsteiger der Woche".
on:
  schedule:
    - cron: "30 21 * * *"   # 21:30 UTC = 22:30/23:30 CH — nach Flugende
  workflow_dispatch:         # manuell ausloesbar

permissions:
  contents: write

concurrency:
  group: badge-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Persistenter Cache: nach dem Erstlauf werden nur neue Fluege geladen.
      - name: Restore WeGlide cache
        uses: actions/cache@v4
        with:
          path: .weglide_cache
          key: weglide-cache-${{ github.run_id }}
          restore-keys: |
            weglide-cache-

      - name: Build snapshot (Saison-Datei + Light-Level-Snapshot + Rang-Snapshots)
        env:
          PROXY_URL: ${{ vars.PROXY_URL }}
        run: |
          python weglide_snapshot_club.py \
            --club 1281 \
            --proxy "${PROXY_URL:-https://sgsaentiscup.vercel.app/api/proxy}" \
            --out-dir public/data

      - name: Build badge history (Level-Verlauf aus dem Tagesarchiv)
        run: |
          python build_badge_history.py --data public/data

      - name: Commit snapshot
        run: |
          git config user.name  "sg-saentis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/badge-levels public/data/badge-history-latest.json public/data/season-badges-*.json public/data/season-points-*.json public/data/badge-rank-snapshots.json public/data/points-rank-snapshots.json
          [ -f public/data/badge-history-backfill.json ] && git add public/data/badge-history-backfill.json || true
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Badge-Snapshot $(date -u +%F)"
            git push
          fi
